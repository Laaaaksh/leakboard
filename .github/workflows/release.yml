name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# A release run must never be cancelled mid-publish (a half-pushed multi-arch
# image is worse than a queued one), so overlapping runs queue instead:
# cancel-in-progress stays unset. Distinct tags are distinct refs and never
# share a group anyway; the guard covers the delete-and-re-push-same-tag race.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes from CHANGELOG
        id: notes
        run: scripts/release_notes.sh "$RUNNER_TEMP/release-notes.md" "${GITHUB_REF_NAME#v}"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy frontend into embed dir
        run: |
          rm -rf internal/webui/dist
          cp -r web/dist internal/webui/dist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/laaaaksh/leakboard:${{ github.ref_name }}
            ghcr.io/laaaaksh/leakboard:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes.md
